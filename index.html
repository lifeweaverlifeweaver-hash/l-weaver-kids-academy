<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Weaver Kids Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #F7F9FC; color: #2F2E41; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .score { background: #FFE66D; padding: 6px 12px; border-radius: 15px; font-weight: bold; }
        .btn { background: #FF6B6B; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        input { width: 100%; padding: 10px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
        .feedback { margin-top: 10px; padding: 10px; border-radius: 8px; font-weight: bold; display: none; }
        .correct { background: #D4EDDA; color: #155724; display: block; }
        .wrong { background: #F8D7DA; color: #721C24; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h3 style="margin:0; color:#FF6B6B;">🎓 L-Weaver Kids</h3>
            <div class="score">⭐ <span id="s">0</span></div>
        </div>
        <p style="font-weight:bold;">Колко е 3 + 4 ?</p>
        <input type="number" id="ans" placeholder="Въведи отговор...">
        <button class="btn" onclick="check()">Провери ✨</button>
        <div id="fb" class="feedback"></div>
    </div>

    <script>
        let sc = 0;
        function check() {
            let val = parseInt(document.getElementById('ans').value);
            let fb = document.getElementById('fb');
            if (val === 7) {
                fb.className = "feedback correct";
                fb.innerText = "Браво! +1 ⭐";
                sc++;
                document.getElementById('s').innerText = sc;
            } else {
                fb.className = "feedback wrong";
                fb.innerText = "Опитай пак!";
            }
        }
    </script>
</body>
</html>
